<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Old links to the one-page view (/#simple) now go to the static resume page. -->
    <script>
      if (location.hash === '#simple') {
        var tr = /^tr/i.test(navigator.language || '');
        try {
          var saved = JSON.parse(localStorage.getItem('ubuntu-xp-storage') || '{}');
          var chosen = saved && saved.state && saved.state.settings && saved.state.settings.langOverride;
          if (chosen) tr = chosen === 'tr';
        } catch (e) {}
        location.replace(tr ? '/tr/ozgecmis/' : '/resume/');
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5e2ca5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YB Portfolio" />

    <!--
      Title, description, canonical, hreflang, Open Graph, Twitter and JSON-LD are generated at build
      time from src/os/content (scripts/seo/plugin.ts). Do not write them here.
    -->
    <!--seo:head-->
  </head>
  <body>
    <!-- Name, role and links as plain HTML: what crawlers and no-JS visitors read. main.tsx removes it. -->
    <!--seo:boot-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
